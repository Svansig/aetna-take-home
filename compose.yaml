# Single-service deployment for a Docker-enabled host (e.g. a Proxmox LXC).
# The API is published on the host's loopback interface only, where a locally
# running Cloudflare Tunnel connector (cloudflared) can reach it at
# http://127.0.0.1:${HOST_PORT}. It is never bound to a public interface.
services:
  api:
    build: .
    image: movie-services:local
    init: true # tini as PID 1: forwards signals, reaps zombies
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Paths inside the container. Override only if the mounts below change.
      MOVIES_DB_PATH: /app/db/movies.db
      RATINGS_DB_PATH: /app/db/ratings.db
    ports:
      - '127.0.0.1:${HOST_PORT:-3000}:3000'
    volumes:
      # Supplied databases, read-only.
      - ./db/movies.db:/app/db/movies.db:ro
      - ./db/ratings.db:/app/db/ratings.db:ro
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
